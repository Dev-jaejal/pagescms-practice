<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<style>
:root { --bg:#f4f2ec; --ink:#232b27; --moss:#52705e; --coast:#8baab0; --sand:#d8c6a5; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.7; }
header { padding:20px 24px; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; align-items:baseline; }
header a { color:var(--ink); text-decoration:none; font-weight:700; font-size:22px; }
header small, footer { color:#666; }
main { max-width:880px; margin:0 auto; padding:32px 16px; }
h1 { font-weight:500; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; padding:0; list-style:none; }
.card { background:#fff; border:1px solid #e3e0d8; border-radius:6px; overflow:hidden; }
.card a { color:inherit; text-decoration:none; display:block; }
.ph { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--sand); }
.card div { padding:14px 16px; }
.meta { font-size:13px; color:var(--moss); margin:0 0 4px; }
.tag { display:inline-block; background:var(--moss); color:#fff; border-radius:3px; padding:0 6px; margin-right:6px; font-size:12px; }
article img { max-width:100%; border-radius:6px; }
footer { border-top:1px solid #ddd; padding:24px 16px; font-size:14px; text-align:center; }
</style>
</head>
<body>
<header><a href="{{ '/' | relative_url }}">ELSDR</a><small>Pages CMS 연습 사이트</small></header>
<main>{{ content }}</main>
<footer>{{ site.data.contact.address }} · {{ site.data.contact.phone }} · {{ site.data.contact.email }}</footer>
</body>
</html>
